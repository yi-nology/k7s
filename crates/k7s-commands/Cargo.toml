[package]
name = "k7s-commands"
version = "0.5.0"
description = "k7s commands — the full Tauri command surface shared by all shells"
authors = ["k7s"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "k7s_commands"

[features]
default = ["ipc"]
# The #[tauri::command] wrappers + the register_commands! macro. The web
# binary consumes only the `*_impl` business functions and the registry, so
# it disables this and stays tauri-free (musl-static friendly).
ipc = ["dep:tauri"]

[dependencies]
k7s-core = { git = "https://github.com/yi-nology/k7s-core.git", features = ["tauri"] }
k7s-deps = { git = "https://github.com/yi-nology/k7s-deps.git" }
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
