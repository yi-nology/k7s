[package]
name = "k7s-android"
version.workspace = true
description = "k7s — Kubernetes visual monitor for Android"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "k7s_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
k7s-core = { workspace = true, features = ["tauri"] }
k7s-deps.workspace = true
tauri.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-dialog.workspace = true
# serde must stay as a direct dependency: the `#[derive(Serialize)]` proc macro
# generates code that references `serde::Serialize` by crate name, so the crate
# must be in the extern prelude. k7s-deps re-exports serde for non-derive use.
serde.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# tokio: #[tokio::main] / #[tokio::test] in examples generate code that
# references tokio by absolute path — the k7s_deps re-export can't satisfy it.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "k7s-android"
path = "src/main.rs"
