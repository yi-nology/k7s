[package]
name = "k7s-core"
version = "0.3.6"
description = "k7s core — transport-agnostic Kubernetes business logic"
authors = ["k7s"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "k7s_core"

[dependencies]
# Shared dependencies via k7s-deps (re-exported for downstream consumers)
k7s-deps = { path = "../../../k7s-deps" }

# serde must stay as a direct dependency: the `#[derive(Serialize)]` proc macro
# generates code that references `serde::Serialize` by crate name, so the crate
# must be in the extern prelude. k7s-deps re-exports serde for non-derive use.
serde = { version = "1", features = ["derive"] }

# thiserror must stay as a direct dependency: the `#[derive(Error)]` proc macro
# generates code that references `thiserror` by crate name.
thiserror = "2"

# tokio must stay as a direct dependency: the `#[tokio::test]` and `#[tokio::main]`
# proc macros generate code that references `tokio` by crate name.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }

# Dependencies not in k7s-deps (optional/specialized)
tauri = { version = "2", optional = true }
rmcp = { version = "3", optional = true, features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = { version = "1.0", features = ["chrono04"], optional = true }

[features]
default = []
tauri = ["dep:tauri"]
mcp = ["dep:rmcp", "dep:schemars"]

[dev-dependencies]
proptest = "1"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
