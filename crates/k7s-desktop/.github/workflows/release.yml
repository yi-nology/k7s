name: CI

# ── k7s-desktop: CI only (cargo check / clippy / fmt / test)
# ── All release builds are in k7s repository.
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # Backend gate: cargo check / clippy / fmt / test (Rust only).
  # ────────────────────────────────────────────────────────────────
  backend:
    name: backend (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - name: cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo fmt check
        run: cargo fmt --check

      - name: cargo test
        run: cargo test
