[package]
name = "k7s-deps"
version = "0.1.0"
edition = "2021"
description = "Shared dependencies for k7s project"
authors = ["k7s"]
license = "MIT"

[lib]
name = "k7s_deps"
path = "src/lib.rs"

[dependencies]
# HTTP 客户端
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.6"

# 异步运行时
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
async-trait = "0.1"

# Kubernetes
kube = { version = "4", features = ["client", "config", "runtime", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }
jiff = "0.2"

# 工具库
uuid = { version = "1", features = ["v4"] }
keyring = { version = "4" }
urlencoding = "2"
regex = "1"
rand = "0.10"
dirs = "5"
dunce = "1"
http = "1"
base64 = "0.23"
flate2 = "1"
rustls = { version = "0.23", features = ["ring"] }
# TLS *serving* for the web shell (k7s-web --tls-cert/--tls-key). Versions
# must track `rustls` above: tokio-rustls 0.26 wraps rustls 0.23, and its
# default features pull aws-lc-rs — pin to ring so both agree on the one
# crypto provider the binaries install at startup. rustls-pemfile 2.x is the
# PEM parser matching rustls 0.23's pki-types.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile = "2"

# Apple targets: keyring needs the native store, which hard-errors at
# compile time without its `protected` feature (the v0.5.x iOS shell hit
# exactly this). The store package is macOS/iOS-only code — compiling it on
# Linux breaks (security_framework imports), hence the cfg gate.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }
apple-native-keyring-store = { version = "1", features = ["protected"] }

[features]
default = []
