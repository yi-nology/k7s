# Sub-repo pins for CI assembly: <short-name> <main SHA>.
#
# `ci.yml` reads `ref:` for every sub-repo checkout from this file, so the
# assembled workspace is reproducible instead of tracking each remote's main
# (a push to any sub-repo could otherwise break hub CI nondeterministically).
#
# Update after every `make sync-repos` run — the values are simply each
# repo's current main tip:
#   for r in deps core commands server desktop ios android frontend; do
#     echo "$r $(git ls-remote https://github.com/yi-nology/k7s-$r.git refs/heads/main | cut -f1)"
#   done
#
# A missing/empty pin makes that checkout fall back to the default branch,
# so a stale lock degrades to the old behavior instead of failing the build.
# The release workflows intentionally do NOT pin — a release should build
# from each repo's current main.
