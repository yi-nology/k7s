[package]
name = "k7s"
version = "0.1.0"
description = "k7s - a cross-platform Kubernetes cluster manager"
authors = ["k7s contributors"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "k7s_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
kube = { version = "1", features = ["default", "runtime", "ws"] }
kube-client = { version = "1", features = ["ws"] }
k8s-openapi = { version = "0.25", features = ["latest"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
