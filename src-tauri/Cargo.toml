[package]
name = "k7s"
version = "0.3.6"
description = "k7s — a Lens-style Kubernetes visual monitor"
authors = ["k7s"]
edition = "2021"
default-run = "k7s"
rust-version = "1.77.2"

[lib]
name = "k7s_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- k7s core (transport-agnostic business logic) ---
k7s-core = { path = "../crates/k7s-core", features = ["tauri"] }

# --- Shared dependencies (unified via k7s-deps re-exports) ---
# Points at the in-repo submodule; the workspace stays self-contained.
k7s-deps = { path = "../crates/k7s-deps" }

# --- Tauri shell ---
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

# --- Proc-macro dependencies (must be in extern prelude) ---
# serde: #[derive(Serialize)] generates code that references serde::Serialize
serde = { version = "1", features = ["derive"] }
# thiserror: #[derive(Error)] generates code that references thiserror
thiserror = "2"
# tokio: #[tokio::main] / #[tokio::test] generate code that references tokio.
# "signal" feature: SIGTERM handler for window-state save on dev/run.sh kill.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }

# --- Web mode (axum HTTP server, k7s-web binary) ---
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"], optional = true }
rust-embed = { version = "8", optional = true }
open = { version = "5", optional = true }
mime_guess = { version = "2", optional = true }

# --- MCP mode (stdio MCP server, k7s-mcp binary) ---
rmcp = { version = "3", optional = true, features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = { version = "1.0", features = ["chrono04"], optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
web = ["dep:axum", "dep:tower", "dep:tower-http", "tower-http/fs", "dep:rmcp", "dep:schemars", "rmcp/transport-streamable-http-server", "dep:rust-embed", "dep:open", "dep:mime_guess", "k7s-core/mcp"]
mcp = ["dep:rmcp", "dep:schemars", "k7s-core/mcp"]

[[bin]]
name = "k7s"
path = "src/main.rs"

[[bin]]
name = "k7s-web"
path = "src/bin/k7s-web.rs"
required-features = ["web"]

[[bin]]
name = "k7s-mcp"
path = "src/bin/k7s-mcp.rs"
required-features = ["mcp"]

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Release profile is defined in the workspace root Cargo.toml.
