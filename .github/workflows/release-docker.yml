name: Release Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: build frontend
    runs-on: ubuntu-22.04
    steps:
      - name: checkout k7s-frontend
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-frontend
          path: k7s-frontend

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: build frontend
        run: |
          cd k7s-frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: k7s-frontend/dist
          retention-days: 1

  release:
    name: docker (multi-arch)
    needs: build-frontend
    runs-on: ubuntu-22.04
    steps:
      - name: checkout k7s-server
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-server
          path: k7s-server

      - name: checkout k7s-core
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-core
          path: k7s-core

      - name: checkout k7s-deps
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-deps
          path: k7s-deps

      - name: checkout k7s-commands
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-commands
          path: k7s-commands

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # The Dockerfile builds from a workspace layout (crates/ + root manifest).
      # Re-arrange the sibling checkouts into that shape with local [patch]es
      # so the build uses exactly these commits instead of resolving GitHub.
      - name: arrange workspace layout
        run: |
          mkdir -p crates
          mv k7s-server k7s-core k7s-deps k7s-commands crates/
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = [
              "crates/k7s-deps",
              "crates/k7s-core",
              "crates/k7s-commands",
              "crates/k7s-server",
          ]

          [patch."https://github.com/yi-nology/k7s-deps.git"]
          k7s-deps = { path = "crates/k7s-deps" }

          [patch."https://github.com/yi-nology/k7s-core.git"]
          k7s-core = { path = "crates/k7s-core" }

          [patch."https://github.com/yi-nology/k7s-commands.git"]
          k7s-commands = { path = "crates/k7s-commands" }
          EOF

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          docker builder prune -af --filter "until=24h" || true
          df -h /

      - name: set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yi-nology/k7s
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: latest=auto

      - name: build & push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/k7s-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
