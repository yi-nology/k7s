name: Temp GHCR cleanup

on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: "Keep package versions created at/after this ISO 8601 timestamp"
        required: true
        type: string

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - name: delete old ghcr.io/yi-nology/k7s versions
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          set -euo pipefail
          base="/orgs/yi-nology/packages/container/k7s/versions"
          deleted=0; failed=0; rounds=0
          while [ "$rounds" -lt 40 ]; do
            rounds=$((rounds+1))
            ids=$(gh api "$base?per_page=100&page=1" \
              --jq ".[] | select(.created_at < \"${CUTOFF}\") | .id") || ids=""
            [ -z "$ids" ] && break
            for id in $ids; do
              if gh api -X DELETE "$base/$id"; then
                deleted=$((deleted+1))
              else
                failed=$((failed+1)); echo "delete failed: $id" >&2
              fi
            done
          done
          echo "== deleted=$deleted failed=$failed =="
          echo "== remaining versions =="
          gh api "$base?per_page=100" \
            --jq '.[] | (.id|tostring) + " | " + (.metadata.container.tags|join(",")) + " | " + .created_at'
