name: CI

# The hub repo carries no code — this job ASSEMBLES the aggregation
# workspace from the 8 sub-repos' main branches (the same layout the local
# k7/ dev root uses: crates/<repo> + frontend/, root Cargo.toml with
# [patch] redirecting the git deps) and runs the full verification battery
# on it. This is the only place the cross-crate invariants (registry
# reconciliation, cross-target cfg checks, version agreement) can run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: read sub-repo pins (versions.lock; empty pin → default branch)
        id: pins
        run: |
          while read -r name sha; do
            case "$name" in ''|\#*) continue ;; esac
            echo "$name=$sha" >> "$GITHUB_OUTPUT"
          done < versions.lock
      - name: checkout k7s-deps
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-deps, path: crates/k7s-deps, ref: "${{ steps.pins.outputs.deps }}" }
      - name: checkout k7s-core
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-core, path: crates/k7s-core, ref: "${{ steps.pins.outputs.core }}" }
      - name: checkout k7s-commands
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-commands, path: crates/k7s-commands, ref: "${{ steps.pins.outputs.commands }}" }
      - name: checkout k7s-server
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-server, path: crates/k7s-server, ref: "${{ steps.pins.outputs.server }}" }
      - name: checkout k7s-desktop
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-desktop, path: crates/k7s-desktop, ref: "${{ steps.pins.outputs.desktop }}" }
      - name: checkout k7s-ios
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-ios, path: crates/k7s-ios, ref: "${{ steps.pins.outputs.ios }}" }
      - name: checkout k7s-android
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-android, path: crates/k7s-android, ref: "${{ steps.pins.outputs.android }}" }
      - name: checkout k7s-frontend
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-frontend, path: frontend, ref: "${{ steps.pins.outputs.frontend }}" }

      - name: write aggregation root Cargo.toml
        run: |
          cat > Cargo.toml <<'EOF'
          # Assembled aggregation workspace (mirrors the local k7/ dev root).
          [workspace]
          resolver = "2"
          members = [
            "crates/k7s-deps",
            "crates/k7s-core",
            "crates/k7s-commands",
            "crates/k7s-server",
            "crates/k7s-desktop",
            "crates/k7s-ios",
            "crates/k7s-android",
          ]

          [patch."https://github.com/yi-nology/k7s-deps.git"]
          k7s-deps = { path = "crates/k7s-deps" }

          [patch."https://github.com/yi-nology/k7s-core.git"]
          k7s-core = { path = "crates/k7s-core" }

          [patch."https://github.com/yi-nology/k7s-commands.git"]
          k7s-commands = { path = "crates/k7s-commands" }

          [patch."https://github.com/yi-nology/k7s-server.git"]
          k7s-server = { path = "crates/k7s-server" }

          [profile.release]
          codegen-units = 1
          lto = true
          opt-level = "s"
          strip = true
          EOF

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential file
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: build frontend + fan out dist
        run: |
          cd frontend && pnpm install --frozen-lockfile && pnpm build && cd ..
          for c in crates/k7s-desktop crates/k7s-ios crates/k7s-android crates/k7s-server; do
            rm -rf "$c/dist"
            cp -r frontend/dist "$c/dist"
          done

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p k7s-server --features web --test web_api
      - run: cargo test -p k7s-server --features web --test reconciliation
      - run: cargo check -p k7s-server --features web,mcp

      - name: check k7s crate versions agree
        run: |
          # The 6 k7s crates must share one version (k7s-deps is on its own line).
          vers=$(for c in k7s-core k7s-commands k7s-server k7s-desktop k7s-ios k7s-android; do
            sed -n -E 's/^version = "(.*)"/\1/p' "crates/$c/Cargo.toml" | head -1
          done | sort -u)
          # awk NR — BSD wc pads its output with spaces, which broke the
          # string compare on macOS runners.
          count=$(printf '%s\n' "$vers" | awk 'END {print NR}')
          if [ "$count" != "1" ]; then
            echo "✗ k7s crate versions disagree across sub-repos:"; printf '%s\n' "$vers"; exit 1
          fi
          echo "✓ all k7s crates on $vers"

  frontend:
    name: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: read sub-repo pins (versions.lock; empty pin → default branch)
        id: pins
        run: |
          while read -r name sha; do
            case "$name" in ''|\#*) continue ;; esac
            echo "$name=$sha" >> "$GITHUB_OUTPUT"
          done < versions.lock
      - uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-frontend, path: frontend, ref: "${{ steps.pins.outputs.frontend }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck && pnpm lint && pnpm test -- --run && pnpm build
        working-directory: frontend

  # Cross-compile smoke checks. The iOS/Android shells and the musl web
  # binary shipped broken cfg gaps in v0.5.x precisely because no CI ever
  # compiled those targets. cargo check needs no NDK signing; ring/aws-lc-sys
  # (via rustls) DO need a cross C compiler, hence the NDK env for Android.
  cross-targets:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-ios
            check: cargo check -p k7s-commands --target
          - os: ubuntu-22.04
            target: aarch64-linux-android
            check: cargo check -p k7s-commands --target
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            check: cargo check -p k7s-server --features web,mcp --target
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: read sub-repo pins (versions.lock; empty pin → default branch)
        id: pins
        run: |
          while read -r name sha; do
            case "$name" in ''|\#*) continue ;; esac
            echo "$name=$sha" >> "$GITHUB_OUTPUT"
          done < versions.lock
      - name: checkout k7s-deps
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-deps, path: crates/k7s-deps, ref: "${{ steps.pins.outputs.deps }}" }
      - name: checkout k7s-core
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-core, path: crates/k7s-core, ref: "${{ steps.pins.outputs.core }}" }
      - name: checkout k7s-commands
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-commands, path: crates/k7s-commands, ref: "${{ steps.pins.outputs.commands }}" }
      - name: checkout k7s-server
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-server, path: crates/k7s-server, ref: "${{ steps.pins.outputs.server }}" }
      - name: checkout k7s-desktop
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-desktop, path: crates/k7s-desktop, ref: "${{ steps.pins.outputs.desktop }}" }
      - name: checkout k7s-ios
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-ios, path: crates/k7s-ios, ref: "${{ steps.pins.outputs.ios }}" }
      - name: checkout k7s-android
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-android, path: crates/k7s-android, ref: "${{ steps.pins.outputs.android }}" }
      - name: checkout k7s-frontend
        uses: actions/checkout@v4
        with: { repository: yi-nology/k7s-frontend, path: frontend, ref: "${{ steps.pins.outputs.frontend }}" }

      - name: write aggregation root Cargo.toml
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = [
            "crates/k7s-deps",
            "crates/k7s-core",
            "crates/k7s-commands",
            "crates/k7s-server",
            "crates/k7s-desktop",
            "crates/k7s-ios",
            "crates/k7s-android",
          ]

          [patch."https://github.com/yi-nology/k7s-deps.git"]
          k7s-deps = { path = "crates/k7s-deps" }

          [patch."https://github.com/yi-nology/k7s-core.git"]
          k7s-core = { path = "crates/k7s-core" }

          [patch."https://github.com/yi-nology/k7s-commands.git"]
          k7s-commands = { path = "crates/k7s-commands" }

          [patch."https://github.com/yi-nology/k7s-server.git"]
          k7s-server = { path = "crates/k7s-server" }

          [profile.release]
          codegen-units = 1
          lto = true
          opt-level = "s"
          strip = true
          EOF

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential file musl-tools
      - uses: nttld/setup-ndk@v1
        if: matrix.target == 'aarch64-linux-android'
        with:
          ndk-version: r26d
      - name: export cross CC env
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            echo "CC_aarch64_linux_android=$TC/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
            echo "AR_aarch64_linux_android=$TC/llvm-ar" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          elif [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: build frontend dist (rust-embed needs ./dist to exist)
        run: |
          cd frontend && pnpm install --frozen-lockfile && pnpm build && cd ..
          for c in crates/k7s-server crates/k7s-desktop; do
            rm -rf "$c/dist"; cp -r frontend/dist "$c/dist"
          done
      - run: ${{ matrix.check }} ${{ matrix.target }}
