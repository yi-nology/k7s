name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    name: build frontend
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  release:
    name: desktop (${{ matrix.os }})
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: stable
          - os: ubuntu-22.04-arm
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/k7s-desktop/dist

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - name: build & release desktop
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'k7s ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          projectPath: crates/k7s-desktop

      # ── 校验和: 每个桌面产物配一个 .sha256, install.sh 下载后核对 ──
      - name: generate desktop bundle checksums
        if: always() && steps.tauri.conclusion == 'success'
        shell: bash
        run: |
          cd crates/k7s-desktop/target/release/bundle
          find . -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*-setup.exe" -o -name "*.msi" \) | while read -r f; do
            (cd "$(dirname "$f")" && shasum -a 256 "$(basename "$f")" > "$(basename "$f").sha256") || sha256sum "$f" > "$f.sha256"
            echo "checksum written: $f.sha256"
          done

      - name: upload desktop bundle checksums
        if: always() && steps.tauri.conclusion == 'success'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            crates/k7s-desktop/target/release/bundle/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 注入 glibc 2.35 到 AppImage, 兼容麒麟桌面 (glibc 2.31) ──
      - name: bundle glibc into AppImage (Kylin compatibility)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # 安装 appimagetool (本身也是 AppImage, 需要 APPIMAGE_EXTRACT_AND_RUN)
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          # 找到 Tauri 生成的 AppImage
          APPIMAGE=$(find crates/k7s-desktop/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping glibc bundling"
            exit 0
          fi
          echo "Found AppImage: $APPIMAGE"

          # 解包
          cd /tmp
          "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract

          # 复制 glibc 核心库
          mkdir -p squashfs-root/usr/lib/x86_64-linux-gnu
          cp /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 squashfs-root/usr/lib/x86_64-linux-gnu/
          cp /lib/x86_64-linux-gnu/libc.so.6           squashfs-root/usr/lib/x86_64-linux-gnu/
          cp /lib/x86_64-linux-gnu/libm.so.6           squashfs-root/usr/lib/x86_64-linux-gnu/
          cp /lib/x86_64-linux-gnu/libpthread.so.0     squashfs-root/usr/lib/x86_64-linux-gnu/
          cp /lib/x86_64-linux-gnu/libdl.so.2          squashfs-root/usr/lib/x86_64-linux-gnu/
          cp /lib/x86_64-linux-gnu/librt.so.1          squashfs-root/usr/lib/x86_64-linux-gnu/
          cp /lib/x86_64-linux-gnu/libresolv.so.2      squashfs-root/usr/lib/x86_64-linux-gnu/
          cp /lib/x86_64-linux-gnu/libnss_dns.so.2     squashfs-root/usr/lib/x86_64-linux-gnu/
          cp /lib/x86_64-linux-gnu/libnss_files.so.2   squashfs-root/usr/lib/x86_64-linux-gnu/

          # 创建 AppRun wrapper: 强制使用自带的 glibc
          mv squashfs-root/AppRun squashfs-root/AppRun.wrapped
          { echo '#!/bin/bash'
            echo 'SELF=$(readlink -f "$0")'
            echo 'HERE=${SELF%/*}'
            echo 'export LD_LIBRARY_PATH="$HERE/usr/lib/x86_64-linux-gnu:$HERE/usr/lib:$HERE/lib:$LD_LIBRARY_PATH"'
            echo 'exec "$HERE/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2" \'
            echo '    --library-path "$HERE/usr/lib/x86_64-linux-gnu:$HERE/usr/lib:$HERE/lib" \'
            echo '    "$HERE/AppRun.wrapped" "$@"'
          } > squashfs-root/AppRun
          chmod +x squashfs-root/AppRun squashfs-root/AppRun.wrapped

          # 重新打包
          /tmp/appimagetool squashfs-root \
            "$GITHUB_WORKSPACE/crates/k7s-desktop/target/release/bundle/appimage/k7s-linux-x86_64-glibc231.AppImage"

          echo "✓ AppImage with bundled glibc 2.35 created"

      - name: checksum Kylin AppImage
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: shasum -a 256 crates/k7s-desktop/target/release/bundle/appimage/k7s-linux-x86_64-glibc231.AppImage > crates/k7s-desktop/target/release/bundle/appimage/k7s-linux-x86_64-glibc231.AppImage.sha256

      - name: upload Kylin-compatible AppImage
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            crates/k7s-desktop/target/release/bundle/appimage/k7s-linux-x86_64-glibc231.AppImage
            crates/k7s-desktop/target/release/bundle/appimage/k7s-linux-x86_64-glibc231.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # k7s-web embeds the frontend from its own ./dist (rust-embed).
      - name: copy dist for k7s-server rust-embed
        shell: bash
        run: cp -r crates/k7s-desktop/dist crates/k7s-server/dist

      # ── Dynamic-linked build (native glibc) — macOS/Windows only ──
      # Linux ships only the musl static binary (see below).
      - name: build k7s-web (dynamic)
        if: runner.os != 'Linux'
        run: cargo build --release --features web --bin k7s-web --manifest-path crates/k7s-server/Cargo.toml
        working-directory: crates/k7s-server

      - name: rename and upload k7s-web
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd crates/k7s-server/target/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp k7s-web.exe k7s-web-windows-x64.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp k7s-web k7s-web-macos-$(uname -m)
          fi
          for f in k7s-web-*; do
            [ -f "$f" ] && (shasum -a 256 "$f" > "$f.sha256" || sha256sum "$f" > "$f.sha256")
          done

      - name: upload k7s-web
        if: runner.os != 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            crates/k7s-server/target/release/k7s-web-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Static-linked build (musl, glibc-free) — Linux only ──
      - name: build k7s-web (musl static)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          if [ "${{ runner.arch }}" = "X64" ]; then
            TARGET=x86_64-unknown-linux-musl
            SUFFIX=x86_64
          else
            TARGET=aarch64-unknown-linux-musl
            SUFFIX=aarch64
          fi
          rustup target add "$TARGET"
          cargo build --release --features web --bin k7s-web --manifest-path crates/k7s-server/Cargo.toml \
            --target "$TARGET"
          # Note: do NOT strip musl binaries — strip can corrupt them.
          cp "target/${TARGET}/release/k7s-web" \
             "../../k7s-web-linux-${SUFFIX}-static"
          cd ../..
          (shasum -a 256 "k7s-web-linux-${SUFFIX}-static" > "k7s-web-linux-${SUFFIX}-static.sha256" \
            || sha256sum "k7s-web-linux-${SUFFIX}-static" > "k7s-web-linux-${SUFFIX}-static.sha256")
        working-directory: crates/k7s-server

      - name: upload k7s-web (musl static)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            k7s-web-linux-*-static
            k7s-web-linux-*-static.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
