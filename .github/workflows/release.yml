name: release

# Triggered when you push a tag like v0.4.1. The version in
# src-tauri/tauri.conf.json and src-tauri/Cargo.toml MUST match the
# stripped tag (e.g. tag v0.4.1 → config says "0.4.1") or
# tauri-action will refuse with "version mismatch".
#
# If you want a non-release sanity build, push a normal commit to main
# or open a PR — the `build` job runs on every push and PR via the
# push / pull_request triggers at the bottom.
#
# What this produces on each runner (Tauri's default bundle matrix
# because src-tauri/tauri.conf.json has bundle.targets = "all"):
#
#   ubuntu-22.04 →  k7s_x.y.z_amd64.deb
#                    k7s-x.y.z-1.x86_64.rpm
#                    k7s_x.y.z_amd64.AppImage
#
#   macos-latest →  k7s_x.y.z_aarch64.dmg   (Apple Silicon runner)
#                    k7s.app
#                    plus the x86_64 .dmg when run on intel runners
#
#   windows-latest → k7s_x.y.z_x64-setup.exe   (NSIS)
#                    k7s_x.y.z_x64_en-US.msi   (WiX)
#
# Code signing / notarisation is intentionally NOT wired up here — the
# `signingIdentity` / `appleId` / `windows.certificate` inputs are
# commented below. Plug them in once you have a Developer ID cert and an
# Apple notarisation password, plus the matching repo secrets.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # needed so the release step can push a tag / upload assets

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1) Sanity build on every push / PR — no release artefacts.
  # ────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: stable
            pkg: deb,rpm,appimage
          - os: macos-latest
            rust: stable
            pkg: dmg,app
          - os: windows-latest
            rust: stable
            pkg: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          # cache the workspace that contains Cargo.toml
          workspaces: src-tauri -> target

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - name: install JS deps
        run: pnpm install --frozen-lockfile

      # Run unit tests first — much cheaper than a full Tauri build,
      # catches regressions in the React / lib layer before we touch
      # the Rust toolchain.
      - name: run JS unit tests
        run: pnpm test -- --run

      # No `--bundles` so tauri-action uses the platform default
      # (the "all" set in tauri.conf.json) — that already covers every
      # format the matrix row is responsible for. On push / PR we don't
      # want to upload to a release, so we pass `releaseTag: ""` to make
      # tauri-action skip the GitHub-release side-effect.
      - name: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseTag: ""

  # ────────────────────────────────────────────────────────────────
  # 2) Tagged release — same matrix, but uploads artefacts to a
  #    GitHub release named after the tag.
  # ────────────────────────────────────────────────────────────────
  release:
    name: release (${{ matrix.os }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - name: install JS deps
        run: pnpm install --frozen-lockfile

