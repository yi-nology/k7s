name: CI & Release

# ── Trigger summary ──────────────────────────────────────────────
#   tag v*    →  release + docker jobs run (full bundle + container)
#   push main →  frontend + backend jobs run (cheap CI gate)
#   pull req  →  frontend + backend jobs run (same)
#   dispatch  →  release + docker jobs run on demand
#
# Why no Tauri build on main pushes?  Building 3 OS matrix on every
# commit eats 15-20 minutes of CI per push. The frontend + backend
# jobs are the cheap gate that catches typecheck / vitest / cargo
# failures fast. Anything that affects the actual bundle is
# exercised on tag.
#
# Version sync requirement (for tag pushes):
#   tag v0.2.3   →   package.json / tauri.conf.json / Cargo.toml all
#                     say "0.2.3"  (tauri-action enforces this).
# ─────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1) Frontend gate: typecheck + unit tests (JS/TS only).
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: frontend (ubuntu)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: 'pnpm'

      - name: install JS deps
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: run JS unit tests
        run: pnpm test -- --run

  # ────────────────────────────────────────────────────────────────
  # 2) Backend gate: cargo check / clippy / fmt / test (Rust only).
  # ────────────────────────────────────────────────────────────────
  backend:
    name: backend (ubuntu)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - name: cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        run: cargo check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: cargo fmt check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

  # ────────────────────────────────────────────────────────────────
  # 3) Tag push → full Tauri bundle matrix + GitHub release.
  # ────────────────────────────────────────────────────────────────
  release:
    name: release (${{ matrix.os }})
    needs: [frontend, backend]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - name: install JS deps
        run: pnpm install --frozen-lockfile

      - name: run JS unit tests
        run: pnpm test -- --run

      - name: build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectName: k7s
          tagName: ${{ github.ref_name }}
          releaseName: 'k7s ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false

  # ────────────────────────────────────────────────────────────────
  # 4) Tag push → container image (linux/amd64 + linux/arm64) to ghcr.io.
  # ────────────────────────────────────────────────────────────────
  docker:
    name: docker (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          docker builder prune -af --filter "until=24h" || true
          df -h /

      - name: set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zy84338719/k7s
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: latest=auto

      - name: build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

# ─────────────────────────────────────────────────────────────────
# What this produces
# ─────────────────────────────────────────────────────────────────
#
#   tag v0.2.3   →  6 desktop bundles:
#                    k7s_0.2.3_amd64.deb / .rpm / .AppImage
#                    k7s_0.2.3_aarch64.dmg + k7s.app
#                    k7s_0.2.3_x64-setup.exe + k7s_0.2.3_x64_en-US.msi
#                    + latest.json (Tauri auto-updater manifest)
#                  + ghcr.io/zy84338719/k7s:v0.2.3 / 0.2.3 / 0.2 / latest
#                    (multi-arch: linux/amd64 + linux/arm64)
#
#   push to main →  ~1 min frontend + backend runs, no Tauri build,
#                  no image push. Catches typecheck + vitest + cargo
#                  failures fast.
#
#   pull_request →  same as push to main.
