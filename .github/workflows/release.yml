name: CI & Release

# ── Trigger summary ──────────────────────────────────────────────
#   tag v*    →  release + android + ios + docker jobs run
#   push main →  frontend job runs (cheap CI gate)
#   pull req  →  frontend job runs (same)
#   dispatch  →  all jobs run on demand
#
# All build artifacts are published to k7s releases.
# Code lives in: k7s-desktop, k7s-android, k7s-ios, k7s-frontend
# ─────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1) Frontend gate: typecheck + unit tests (JS/TS only).
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: frontend (ubuntu)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: 'pnpm'

      - name: install JS deps
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: run JS unit tests
        run: pnpm test -- --run

  # ────────────────────────────────────────────────────────────────
  # 2) Build frontend (shared by all clients).
  # ────────────────────────────────────────────────────────────────
  build-frontend:
    name: build frontend
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: checkout k7s-frontend
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-frontend
          path: k7s-frontend

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: build frontend
        run: |
          cd k7s-frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: k7s-frontend/dist
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # 3) Desktop release (Linux/macOS/Windows).
  # ────────────────────────────────────────────────────────────────
  release-desktop:
    name: desktop (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: stable
          - os: ubuntu-22.04-arm
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout k7s-desktop
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-desktop
          path: k7s-desktop

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: k7s-desktop -> target

      - name: install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file

      - name: build & release desktop
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'k7s ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          projectPath: k7s-desktop

      - name: build k7s-web
        run: cargo build --release --features web --bin k7s-web
        working-directory: k7s-desktop

      - name: rename and upload k7s-web
        shell: bash
        run: |
          cd k7s-desktop/target/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp k7s-web.exe k7s-web-windows-x64.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp k7s-web k7s-web-macos-$(uname -m)
          else
            cp k7s-web k7s-web-linux-$(uname -m)
          fi

      - name: upload k7s-web
        uses: softprops/action-gh-release@v3
        with:
          files: |
            k7s-desktop/target/release/k7s-web-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────
  # 4) Android release.
  # ────────────────────────────────────────────────────────────────
  release-android:
    name: android
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-frontend
    runs-on: ubuntu-22.04
    steps:
      - name: checkout k7s-android
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-android
          path: k7s-android

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: k7s-android -> target

      - name: install Tauri CLI
        run: cargo install tauri-cli

      - name: build Android
        run: |
          cd k7s-android
          cargo tauri android build

      - name: rename APK
        run: |
          cd k7s-android/target/release/apk
          mv app.aab k7s-${{ github.ref_name }}.aab || true
          find . -name "*.apk" -exec mv {} k7s-${{ github.ref_name }}.apk \; || true

      - name: upload Android artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            k7s-android/target/release/apk/*.aab
            k7s-android/target/release/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────
  # 5) iOS release.
  # ────────────────────────────────────────────────────────────────
  release-ios:
    name: ios
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - name: checkout k7s-ios
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-ios
          path: k7s-ios

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: k7s-ios -> target

      - name: install Tauri CLI
        run: cargo install tauri-cli

      - name: build iOS
        run: |
          cd k7s-ios
          cargo tauri ios build

      - name: upload iOS artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            k7s-ios/target/release/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────
  # 6) Docker release (web backend).
  # ────────────────────────────────────────────────────────────────
  docker:
    name: docker (multi-arch)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-frontend
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout k7s-desktop
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-desktop
          path: k7s-desktop

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          docker builder prune -af --filter "until=24h" || true
          df -h /

      - name: set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zy84338719/k7s
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: latest=auto

      - name: build & push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: k7s-desktop
          file: k7s-desktop/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

# ─────────────────────────────────────────────────────────────────
# What this produces (all in k7s releases)
# ─────────────────────────────────────────────────────────────────
#
#   tag v0.3.7   →  Desktop (9 bundles):
#                    k7s_0.3.7_amd64.deb / .rpm / .AppImage
#                    k7s_0.3.7_arm64.deb / .rpm / .AppImage
#                    k7s_0.3.7_aarch64.dmg + k7s.app
#                    k7s_0.3.7_x64-setup.exe + k7s_0.3.7_x64_en-US.msi
#                  + Web (3 binaries):
#                    k7s-web-linux-x86_64 / k7s-web-macos-arm64 / k7s-web-windows-x64.exe
#                  + Android:
#                    k7s-v0.3.7.aab / k7s-v0.3.7.apk
#                  + iOS:
#                    k7s.ipa
#                  + Docker:
#                    ghcr.io/zy84338719/k7s:v0.3.7 (linux/amd64 + arm64)
