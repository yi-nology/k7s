name: Release Android

on:
  # Android build has Tauri mobile_entry_point issue — run manually after fixing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    name: build frontend
    runs-on: ubuntu-22.04
    steps:
      - name: checkout k7s-frontend
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-frontend
          path: k7s-frontend

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: build frontend
        run: |
          cd k7s-frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: k7s-frontend/dist
          retention-days: 1

  release:
    name: android
    needs: build-frontend
    runs-on: ubuntu-22.04
    steps:
      - name: checkout k7s-android
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-android
          path: k7s-android

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: k7s-android -> target

      - name: install Tauri CLI
        run: cargo install tauri-cli

      - name: init Android project
        run: |
          cd k7s-android
          cp -r ../dist ../k7s-android/../dist 2>/dev/null || true
          cargo tauri android init

      - name: build Android
        run: |
          cd k7s-android
          cargo tauri android build

      - name: rename APK
        run: |
          cd k7s-android/target/release/apk
          mv app.aab k7s-${{ github.ref_name }}.aab || true
          find . -name "*.apk" -exec mv {} k7s-${{ github.ref_name }}.apk \; || true

      - name: upload Android artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            k7s-android/target/release/apk/*.aab
            k7s-android/target/release/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
