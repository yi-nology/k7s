name: Release iOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    name: build frontend
    runs-on: ubuntu-22.04
    steps:
      - name: checkout k7s-frontend
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-frontend
          path: k7s-frontend

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: build frontend
        run: |
          cd k7s-frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: k7s-frontend/dist
          retention-days: 1

  release:
    name: ios
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - name: checkout k7s-ios
        uses: actions/checkout@v4
        with:
          repository: yi-nology/k7s-ios
          path: k7s-ios

      - name: download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: k7s-ios -> target

      - name: install Tauri CLI
        run: cargo install tauri-cli

      - name: init iOS project
        run: |
          cd k7s-ios
          cp -r ../dist ../k7s-ios/../dist 2>/dev/null || true
          cargo tauri ios init

      - name: build iOS (skip signing)
        run: |
          cd k7s-ios
          cargo tauri ios build -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
        env:
          # Prevent Tauri from requesting a signing identity
          APPLE_SIGNING_IDENTITY: ""

      - name: upload iOS artifacts
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          files: |
            k7s-ios/target/**/*.ipa
            k7s-ios/gen/apple/build/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
