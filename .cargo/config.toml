# Ensure the `mobile` cfg flag is set for all Android targets.
# The Tauri Gradle plugin (cargo-ndk) sets CARGO_TARGET_*_RUSTFLAGS which
# overrides shell-level RUSTFLAGS exports. A .cargo/config.toml target
# section is the only reliable way to inject extra rustc flags that survive
# the Gradle environment override.
#
# Without this, cfg_attr(mobile, tauri::mobile_entry_point) does not expand
# and the built .so lacks JNI_OnLoad — Tauri's validation rejects it.
[target.aarch64-linux-android]
rustflags = ["--cfg", "mobile"]

[target.armv7-linux-androideabi]
rustflags = ["--cfg", "mobile"]

[target.x86_64-linux-android]
rustflags = ["--cfg", "mobile"]

[target.i686-linux-android]
rustflags = ["--cfg", "mobile"]
