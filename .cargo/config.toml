# Cargo build optimization configuration

# Use parallel compilation
[build]
jobs = 8

# Optimize for Apple Silicon
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# Optimize for x86_64
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

# macOS: use default linker (mold/lld not installed)

# Incremental compilation
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Release optimizations
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Test optimizations
[profile.test]
opt-level = 0
debug = true
incremental = true
