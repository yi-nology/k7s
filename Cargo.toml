# k7 monorepo — local development workspace.
#
# The crates under crates/ are independently publishable git repos (their
# manifests are standalone: concrete versions + git deps between siblings).
# This root workspace exists so local development gets one target dir and one
# lockfile: the [patch] sections below redirect every git dependency to the
# sibling checkout, so local edits reach every crate immediately.

[workspace]
resolver = "2"
members = [
    "crates/k7s-deps",
    "crates/k7s-core",
    "crates/k7s-commands",
    "crates/k7s-server",
    "crates/k7s-desktop",
    "crates/k7s-ios",
    "crates/k7s-android",
]

[patch."https://github.com/yi-nology/k7s-deps.git"]
k7s-deps = { path = "crates/k7s-deps" }

[patch."https://github.com/yi-nology/k7s-core.git"]
k7s-core = { path = "crates/k7s-core" }

[patch."https://github.com/yi-nology/k7s-commands.git"]
k7s-commands = { path = "crates/k7s-commands" }

[patch."https://github.com/yi-nology/k7s-server.git"]
k7s-server = { path = "crates/k7s-server" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
