[package]
name = "k7s"
version = "0.3.6"
description = "k7s — a Lens-style Kubernetes visual monitor"
authors = ["k7s"]
edition = "2021"
default-run = "k7s"
# 1.77.2 is what our dependency set actually needs (tauri-plugin-window-state
# 2.x declares it). Leaving this at 1.77 silently resolved that plugin to a
# v0.1.1 built for Tauri v1 — cargo downgrades rather than complains.
rust-version = "1.77.2"

# The library crate holds all app logic (commands, kube plumbing) so it can be
# unit-tested with `cargo test`; main.rs is a thin binary that calls into it.
[lib]
name = "k7s_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri shell ---
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Native file-open dialog for the "Import kubeconfig" action.
tauri-plugin-dialog = "2"
# Remembers window size/position/monitor across launches (B22).
tauri-plugin-window-state = "2"

# --- Shared dependencies from k7s-deps ---
k7s-deps = { git = "https://github.com/yi-nology/k7s-deps.git" }

# --- Shared core library ---
k7s-core = { git = "https://github.com/yi-nology/k7s-core.git", features = ["tauri"] }

# --- Proc-macro dependencies (must be in extern prelude) ---
# serde: #[derive(Serialize)] generates code that references serde::Serialize
serde = { version = "1", features = ["derive"] }
# thiserror: #[derive(Error)] generates code that references thiserror
thiserror = "2"
# tokio: #[tokio::test] and #[tokio::main] generate code that references tokio
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }

# --- Web mode (Phase 1+ of "browser-only" feature) ---
# A standalone axum server exposing the same command surface as Tauri, so the
# React app can run in a plain browser tab against a real cluster. Only pulled
# in when the `web` feature is on — the desktop build is unaffected.
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"], optional = true }
# Embeds the built React app (dist/) into the k7s-web binary so it can be
# distributed as a single .exe with no external files needed.
rust-embed = { version = "8", optional = true }
# Opens URLs in the default browser — cross-platform, works on Windows 7+.
open = { version = "5", optional = true }
# MIME type guesser for embedded asset serving.
mime_guess = { version = "2", optional = true }

# --- MCP mode ---
# `k7s-mcp` is a stdio MCP server that exposes the same kube plumbing to AI
# clients (Claude Desktop, Cursor, Claude Code, …). Pulls the official Rust
# MCP SDK, which re-exports its own `schemars` version — we depend on
# `schemars` directly so the derives can name the trait (`rmcp` only
# re-exports the symbol, but the path through the re-export isn't usable
# from a derive macro that needs to resolve the trait in the local crate).
# `transport-streamable-http-server` powers the `/mcp` route on k7s-web so
# remote AI clients (not running on the same host as the server) can reach
# the same tools over HTTP.
rmcp = { version = "3", optional = true, features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = { version = "1.0", features = ["chrono04"], optional = true }

[features]
# Reserved for future custom-protocol tweaks; kept so tauri.conf can reference it.
custom-protocol = ["tauri/custom-protocol"]
# Browser mode: enables axum + SSE so `cargo build --features web --bin k7s-web`
# produces a standalone HTTP server that fronts the same kube plumbing.
web = ["dep:axum", "dep:tower", "dep:tower-http", "tower-http/fs", "dep:rmcp", "dep:schemars", "rmcp/transport-streamable-http-server", "dep:rust-embed", "dep:open", "dep:mime_guess"]
# MCP mode: enables the `k7s-mcp` stdio binary. Pulls the MCP SDK.
# Independent of `web` — the MCP server stands on its own.
mcp = ["dep:rmcp", "dep:schemars"]

# Default-deps branch: the lib crate still pulls in the same things; the only
# flip is which binary gets built. `cargo build` → tauri app, `cargo build
# --features web --bin k7s-web` → axum server.
[[bin]]
name = "k7s"
path = "src/main.rs"

[[bin]]
name = "k7s-web"
path = "src/bin/k7s-web.rs"
required-features = ["web"]

[[bin]]
name = "k7s-mcp"
path = "src/bin/k7s-mcp.rs"
required-features = ["mcp"]

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
# Smaller, faster desktop binary.
codegen-units = 1
lto = true
opt-level = "s"
strip = true

