[workspace]
resolver = "2"
members = [
    "crates/k7s-deps",
    "crates/k7s-core",
    "crates/k7s-server",
    "crates/k7s-desktop",
    "crates/k7s-ios",
    "crates/k7s-android",
]
# crates/k7s-commands joins in phase 1 (needs its Cargo.toml first).

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.77.2"
authors = ["k7s"]

[workspace.dependencies]
# --- internal crates ---
k7s-deps = { path = "crates/k7s-deps" }
k7s-core = { path = "crates/k7s-core" }
k7s-server = { path = "crates/k7s-server" }

# --- shared externals (single source of versions; k7s-deps pins the rest) ---
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time"] }
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = { version = "1.0", features = ["chrono04"] }
axum = { version = "0.8" }
tower = { version = "0.5", optional = false, features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
rust-embed = { version = "8" }
open = { version = "5" }
mime_guess = { version = "2" }
argon2 = { version = "0.5", features = ["std"] }
rustls = { version = "0.23", features = ["ring"] }
apple-native-keyring-store = { version = "1", features = ["protected"] }
local-ip-address = "0.6"
hostname = "0.4"
proptest = "1"
http-body-util = "0.1"

[profile.release]
# Smaller, faster release binaries (was per-crate before the workspace merge).
codegen-units = 1
lto = true
opt-level = "s"
strip = true
