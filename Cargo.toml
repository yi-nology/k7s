[package]
name = "k7s-ios"
version = "0.4.0"
description = "k7s — Kubernetes visual monitor for iPad/iOS"
authors = ["k7s"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "k7s_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
k7s-core = { git = "https://github.com/yi-nology/k7s-core.git", features = ["tauri"] }
k7s-deps = { git = "https://github.com/yi-nology/k7s-deps.git" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# serde must stay as a direct dependency: the `#[derive(Serialize)]` proc macro
# generates code that references `serde::Serialize` by crate name, so the crate
# must be in the extern prelude. k7s-deps re-exports serde for non-derive use.
serde = { version = "1", features = ["derive"] }
# apple-native-keyring-store: required on iOS — the keyring crate's default
# features only enable keychain (macOS), not protected (iOS).
apple-native-keyring-store = { version = "1", features = ["protected"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# tokio: #[tokio::main] / #[tokio::test] in examples generate code that
# references tokio by absolute path — the k7s_deps re-export can't satisfy it.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "k7s-ios"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
